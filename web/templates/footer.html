{{define "footer"}}
<footer class="foot">
  <div class="wrap foot-inner">
    <a class="lockup" href="https://abdeen.dev">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="{{asset "/static/brand/lockup-dark.svg"}}">
        <img src="{{asset "/static/brand/lockup-light.svg"}}" alt="Abdeen Labs" width="164" height="32">
      </picture>
    </a>
    <p class="foot-note">Made by Abdeen Labs, the open-source and experimental division of Abdeen Industries.</p>
    <nav class="foot-links" aria-label="More">
      <a href="https://github.com/abdeen-labs/espalier">Source</a>
      <a href="https://github.com/abdeen-labs/espalier/issues/new/choose">Report an Issue</a>
      <a href="https://github.com/abdeen-labs/espalier/blob/main/LICENSE">MIT License</a>
    </nav>
    <p class="fine">© {{.Year}} Abdeen Labs</p>
  </div>
</footer>
{{end}}
